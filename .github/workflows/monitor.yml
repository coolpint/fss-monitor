name: 금감원 징계공시 모니터링

on:
  schedule:
    - cron: '0 * * * *'   # 매시간 실행해 금감원 대량/수시 게시 지연을 줄임
  workflow_dispatch:      # 수동 실행 가능
    inputs:
      test_only:
        description: "시험 알림 1건만 발송 (수집/후보/상태 처리 없음)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: fss-monitor-${{ github.ref }}
  cancel-in-progress: false

jobs:
  monitor:
    if: ${{ vars.FSS_MONITOR_ENABLED == 'true' || (github.event_name == 'workflow_dispatch' && inputs.test_only) }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run monitor
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_CHANNEL_ID: "C0C9LQN7A64"  # 확인된 #fss-monitor
          FSS_MAX_LIST_PAGES: "30"
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.test_only }}" = "true" ]; then
            python monitor.py --test-alert-only
          else
            python monitor.py
          fi

      - name: Save state
        if: ${{ always() && !(github.event_name == 'workflow_dispatch' && inputs.test_only) }}
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          for file in seen.json monitor_health.json; do
            if [ -f "$file" ]; then git add "$file"; fi
          done
          git diff --staged --quiet || git commit -m "Update monitor state"
          git push origin HEAD:${{ github.ref_name }}
