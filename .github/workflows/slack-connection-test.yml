name: Slack 연결 시험 (알림 1건 전용)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-slack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Send one connection test
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_CHANNEL_ID: "C0C9LQN7A64"
        run: python monitor.py --test-alert-only
